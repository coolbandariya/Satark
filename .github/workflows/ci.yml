name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python source
        run: python -m compileall -q satark.py scam_challenge.py video_processing.py reports.py satark_utils.py url_security.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate required project assets
        run: python -c "from pathlib import Path; files=[Path('requirements.txt'),Path('styles.css'),Path('satark.py'),Path('scam_challenge.py'),Path('video_processing.py'),Path('reports.py'),Path('satark_utils.py'),Path('url_security.py')]; missing=[str(p) for p in files if not p.is_file() or p.stat().st_size == 0]; assert not missing, f'Missing or empty files: {missing}'"
