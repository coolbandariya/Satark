name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show runtime
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile Python source
        run: |
          python -m compileall -q \
            satark.py ai_provider.py scam_challenge.py video_processing.py reports.py \
            satark_utils.py url_security.py radar_background.py stepper_component.py evidence_engine.py firstlight_engine.py firstlight_ingest.py ui tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install browser test tooling
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Start Streamlit for browser smoke tests
        run: |
          python -m streamlit run satark.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/satark.log 2>&1 &
          echo $! > /tmp/satark.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/satark.log
          exit 1

      - name: Run browser smoke and layout checks
        env:
          SATARK_E2E_URL: http://127.0.0.1:8501
          SATARK_E2E_ARTIFACTS: artifacts
        run: python tests/e2e_smoke.py

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satark-browser-smoke
          path: |
            artifacts/
            /tmp/satark.log
          if-no-files-found: warn

      - name: Stop Streamlit
        if: always()
        run: |
          if [ -f /tmp/satark.pid ]; then kill $(cat /tmp/satark.pid) || true; fi

      - name: Validate UI stylesheet
        run: |
          python -c "from pathlib import Path; css=Path('styles.css').read_text(encoding='utf-8'); assert css.count('{') == css.count('}'), 'Unbalanced CSS braces'; required=['.hero{','.scanner{','.home-grid{','.home-actions{','.sr-only{','.st-key-result_report','@media(max-width:768px)','prefers-reduced-motion:reduce','overflow-x:hidden']; missing=[x for x in required if x not in css]; assert not missing, f'Missing UI selectors: {missing}'"

      - name: Validate required project assets
        run: |
          python -c "from pathlib import Path; files=[Path('requirements.txt'),Path('styles.css'),Path('satark.py'),Path('config.py'),Path('analysis_engine.py'),Path('findings.py'),Path('input_processing.py'),Path('radar_background.py'),Path('stepper_component.py'),Path('ai_provider.py'),Path('scam_challenge.py'),Path('video_processing.py'),Path('reports.py'),Path('satark_utils.py'),Path('url_security.py'),Path('evidence_engine.py'),Path('ui/__init__.py'),Path('ui/home.py'),Path('ui/navigation.py'),Path('ui/results.py'),Path('ui/history.py'),Path('ui/learning.py'),Path('ui/demo.py')]; missing=[str(p) for p in files if not p.is_file() or p.stat().st_size == 0]; assert not missing, f'Missing or empty files: {missing}'"

      - name: Check source whitespace and accidental empty lines
        run: |
          python - <<'PY'
          from pathlib import Path
          bad=[]
          for path in Path('.').rglob('*.py'):
              if '.git' in path.parts:
                  continue
              lines=path.read_text(encoding='utf-8').splitlines()
              if any(line.endswith((' ', '\\t')) for line in lines):
                  bad.append(f'{path}: trailing whitespace')
              if '\\n\\n\\n\\n' in path.read_text(encoding='utf-8'):
                  bad.append(f'{path}: 3+ consecutive blank lines')
          if bad:
              raise SystemExit('\\n'.join(bad))
          PY
